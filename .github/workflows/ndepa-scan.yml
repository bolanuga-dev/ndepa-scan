name: NDPA Compliance Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ndpa-security-scan:
    name: NDPA Data Privacy Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Policy Unit Tests
        run: |
          go mod tidy
          go test -v ./...

      - name: Build Scanner Binary
        run: |
          go build -o ndepa-scan ./cmd/ndepa-scan/main.go

      - name: Execute Scan on Compliant Manifest
        run: |
          ./ndepa-scan policies/compliant_k8s.yaml
