name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install eBPF Build Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev gcc-multilib
          go install github.com/cilium/ebpf/cmd/bpf2go@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Verify Go Dependencies
        run: go mod verify

      - name: Generate eBPF Bytecode
        run: go generate ./...

      - name: Run Go Tests
        run: go test -v ./...

      - name: Build Binaries
        env:
          CGO_ENABLED: 1
        run: |
          go build -v -o bin/ndepa-scan ./cmd/ndepa-scan
